<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能客服 · Python 工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182339;font:15px/1.7 system-ui,sans-serif}main{max-width:960px;margin:40px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:28px;margin:0}small,.muted{color:#69778e}.pill{border-radius:20px;background:#e6f2ee;color:#267757;padding:5px 12px;font-size:12px}.notice{margin:20px 0;background:#fff5dc;border-radius:10px;padding:12px 16px;color:#735b25}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #d9e0eb;background:white;color:#304761;padding:9px 14px;border-radius:8px;cursor:pointer}button:hover{background:#eaf0ff}#messages{min-height:320px;background:white;border:1px solid #e1e7ef;border-radius:16px;padding:24px}.bubble{margin:12px 0 24px;white-space:pre-wrap;overflow-wrap:anywhere}.role{font-size:12px;color:#6b7f9c;margin-bottom:4px}.user{background:#eff4ff;padding:14px;border-radius:10px}form{display:flex;gap:10px;margin-top:16px}textarea{font:inherit;resize:vertical;flex:1;min-height:74px;border:1px solid #d4dce7;border-radius:10px;padding:12px}#send{background:#315efb;color:white;border:0;min-width:88px}button:disabled{opacity:.5;cursor:wait}footer{display:flex;justify-content:space-between;align-items:center;margin:15px 0}#status{font-size:13px;color:#63738b}
</style>
<main><header><div><h1>智能客服工作台</h1><small>Supervisor → 知识问答 / 工单 → 合规审查</small></div><span class="pill">Python 本地演示</span></header>
<div class="notice">当前使用示例知识库。工单与会话为本机内存数据，重启会清空；尚未对接真实订单、退款或人工客服。</div>
<div class="examples"><button data-q="购买后几天内可以申请退款？">咨询退款政策</button><button data-q="开户需要准备什么材料？">了解开户流程</button><button data-q="我要申请退款，请创建退款工单，原因是买错了产品。">创建退款工单</button></div>
<div id="messages"><div class="role">客服助手</div><div class="bubble">你好，你可以咨询示例产品、退款政策、开户流程，或创建演示工单。</div></div>
<form id="chat"><textarea id="input" required maxlength="4000" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea><button id="send">发送</button></form>
<footer><span id="status">就绪</span><button id="reset" type="button">新建会话</button><a href="/docs" target="_blank">API 文档</a></footer></main>
<script>
let session=null;const input=document.querySelector('#input'),send=document.querySelector('#send'),status=document.querySelector('#status'),messages=document.querySelector('#messages');
function append(role,text){const box=document.createElement('div'),label=document.createElement('div'),body=document.createElement('div');label.className='role';label.textContent=role;body.className='bubble'+(role==='你'?' user':'');body.textContent=text;box.append(label,body);messages.append(box);box.scrollIntoView({behavior:'smooth',block:'nearest'});}
document.querySelector('#chat').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;append('你',text);input.value='';send.disabled=true;document.querySelector('#reset').disabled=true;status.textContent='正在检索、生成并审查回复…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:session})});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');session=d.session_id;append('客服助手',d.response);status.textContent='路由：'+d.intent+' · 审查：'+(d.compliance_passed?'通过':'需人工复核');}catch(e){append('请求未完成',e.message);status.textContent='本次失败，可调整问题后重试';}finally{send.disabled=false;document.querySelector('#reset').disabled=false;input.focus();}};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#chat').requestSubmit();}};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus();});document.querySelector('#reset').onclick=()=>{session=null;messages.replaceChildren();append('客服助手','已新建会话，请输入问题。');status.textContent='就绪';};
</script></html>
