name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q python-impl

      - name: 运行测试
        # 测试用 FakeLLM 替代真实模型，不需要密钥，也不会消耗模型额度
        run: python -m pytest -q
